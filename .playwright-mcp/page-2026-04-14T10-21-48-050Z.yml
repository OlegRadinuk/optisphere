            - generic [ref=e309]: Можно ли строить дом без проекта?
            - img [ref=e311]
          - paragraph [ref=e313]: "Строить без проекта — значит рисковать и деньгами, и безопасностью. Мы делаем полный пакет документов: архитектурный проект, конструктивные решения, инженерные сети. Помогаем получить разрешение на строительство и ввод в эксплуатацию."
        - generic [ref=e315]:
          - button "Вы работаете только в Симферополе?" [ref=e316]:
            - generic [ref=e317]: Вы работаете только в Симферополе?
            - img [ref=e319]
          - paragraph [ref=e321]: "Нет, работаем по всему Крыму: Ялта, Севастополь, Керчь, Евпатория, Феодосия, Бахчисарай. Стоимость выезда в другие города — от 0 руб. при объёме работ от 300 000 руб."
        - generic [ref=e323]:
