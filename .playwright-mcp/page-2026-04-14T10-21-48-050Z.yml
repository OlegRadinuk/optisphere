            - img [ref=e327]
          - paragraph [ref=e329]: Да. Гарантия на отделочные работы — 2 года, на конструктивные (фундамент, стены, кровля) — 5 лет. Все условия прописаны в договоре. Если что-то пошло не так — приедем и исправим за наш счёт.
