            - img [ref=e287]
          - paragraph [ref=e289]: Стоимость зависит от площади, состояния квартиры и класса отделки. Черновой ремонт — от 4 500 руб./м², чистовой — от 7 000 руб./м², дизайнерский — от 12 000 руб./м². Точную цену назовём после выезда замерщика — это бесплатно.
        - generic [ref=e291]:
          - button "Сколько времени занимает ремонт квартиры?" [ref=e292]:
            - generic [ref=e293]: Сколько времени занимает ремонт квартиры?
            - img [ref=e295]
          - paragraph [ref=e297]: "Стандартная «однушка» 40 м² под ключ — 6–8 недель. Двухкомнатная 65 м² — 8–12 недель. На сроки влияют: объём работ, необходимость сушки стяжки, поставки материалов. Сроки фиксируем в договоре."
        - generic [ref=e299]:
          - button "Вы работаете по договору?" [ref=e300]:
            - generic [ref=e301]: Вы работаете по договору?
            - img [ref=e303]
          - paragraph [ref=e305]: Да, обязательно. Заключаем официальный договор подряда с фиксированной сметой, графиком работ и гарантией. Оплата поэтапно — вы платите только за выполненные работы после приёмки каждого этапа.
        - generic [ref=e307]:
