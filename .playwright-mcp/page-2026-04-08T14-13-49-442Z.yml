          - paragraph [ref=e313]: "Строить без проекта — значит рисковать и деньгами, и безопасностью. Мы делаем полный пакет документов: архитектурный проект, конструктивные решения, инженерные сети. Помогаем получить разрешение на строительство и ввод в эксплуатацию."
