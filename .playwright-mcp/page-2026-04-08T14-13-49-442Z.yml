          - paragraph [ref=e289]: Стоимость зависит от площади, состояния квартиры и класса отделки. Черновой ремонт — от 4 500 руб./м², чистовой — от 7 000 руб./м², дизайнерский — от 12 000 руб./м². Точную цену назовём после выезда замерщика — это бесплатно.
