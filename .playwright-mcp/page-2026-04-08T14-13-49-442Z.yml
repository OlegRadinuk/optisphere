            - img [ref=e295]
          - paragraph [ref=e297]: "Стандартная «однушка» 40 м² под ключ — 6–8 недель. Двухкомнатная 65 м² — 8–12 недель. На сроки влияют: объём работ, необходимость сушки стяжки, поставки материалов. Сроки фиксируем в договоре."
