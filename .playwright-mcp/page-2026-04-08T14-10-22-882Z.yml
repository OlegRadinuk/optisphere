              - text: Впервые открыли для себя гостевой дом "Версаль" отдыхали 2 недели в июле 2024 года, все замечательно, соответствует описанию, фотографиям. Здесь очень красиво, комфортно, уютно и идеально чисто! Огромное спасибо Эдему и Диляре за гостеприимство, доброжелательность и отзывчивость в любых вопросах. Отдельное спасибо феям чистоты Галине и Людмиле, вы волшебные! Обязательно приедем в следующем году!
