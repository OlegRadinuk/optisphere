            - paragraph [ref=f6e49]:
              - text: "Очень красивая территория, в гостевом доме чисто. Все было супер удобно! Обстановка в номере хорошо продумана: есть столик на колёсиках, тумбочки и розетки у кровати, сетки от комаров, табуретки, посуда. Добродушные хозяева, откликается на любые просьбы) По вечерам сидели во дворе на скамейке-качеле и смотрели на звёздное небо) Очень понравилось, с удовольствием ещё вернёмся!"
